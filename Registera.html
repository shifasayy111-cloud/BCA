<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        font-family: arial;
        background-color: rgb(240, 240, 240);
        text-align: center;
        margin-top: 50px;
    }
   .sp{
        background-color: rgb(255, 182, 193);
        padding: 30px;
        width: 350px;
        margin: auto;
        border-radius: 10px;
        box-shadow: 0 0 10px rgb(56, 47, 47);
   }
   intput{
        width: 300px;
        height: 50px;
        border-radius: 10px;
        text-align: center;
   }
   </style>
<body>
    <h1>Register Form </h1>
    <form onSubmit=" return validity()" class="sp">
    <input type="text" id="Name" placeholder="Enter Your FullName"><br><br>
    <input type="email" id="Email" placeholder="Enter Your Email"><br><br>
    <input type="password" id="Password" placeholder="Enter Your Password"><br><br>
    <input type="number" id="Contact" placeholder="Enter the Contact Number"><br><br>
    <input type="submit" value="Submit"><br><br>
    </form>
    <script>
        function validity()
        {
            let name=document.getElementById("Name").value;
            let email=document.getElementById("Email").value;
            let password=document.getElementById("Password").value;
            let contact=document.getElementById("Contact").value;
            if(name=="")
            {
                alert("Please Enter Your Name");
                return false;
            }
            if(email=="")
            {
                alert("Please Enter Your Email");
                return false;
            }
            if(password=="")
            {
                alert("Please Enter Your Password");
                return false;
            }
            if(contact=="")
            {
                alert("Please Enter Your Contact Number");
                return false;
            }
            alert("Form Submitted Successfully");
            return true;
        }
        </script>
</body>
</html>
